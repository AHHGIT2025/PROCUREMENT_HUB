<body class="bg-background text-on-background font-body-md h-full flex flex-col antialiased">
<!-- Top Navigation (Shell suppressed as this is a focused modal/view intent, but adding a simplified header to hold the app context if needed. Actually, per instructions: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or "Success/Confirmation" splash screens. Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow." So we suppress SideNavBar and TopAppBar entirely.) -->
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-md sm:p-lg md:p-xl h-full w-full">
<!-- Modal / Focused View Container -->
<div class="bg-surface rounded-xl shadow-[0_12px_32px_rgba(26,43,75,0.12)] border border-border w-full max-w-4xl flex flex-col overflow-hidden">
<!-- Modal Header -->
<header class="flex items-center justify-between px-lg py-md border-b border-border bg-surface-bright">
<div>
<h2 class="font-headline-md text-headline-md text-primary">Workflow Condition Builder</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Define logic for node: <span class="font-code-sm text-code-sm text-secondary bg-surface-container-low px-2 py-0.5 rounded border border-border">APPR_FIN_01</span></p>
</div>
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg overflow-y-auto">
<!-- If/Then Builder Interface -->
<div class="flex flex-col gap-md">
<h3 class="font-headline-sm text-headline-sm text-primary">Condition Rules</h3>
<!-- Rule 1 -->
<div class="flex items-center gap-sm flex-wrap bg-surface-container-lowest border border-border p-md rounded-lg shadow-sm hover:shadow-[0_4px_12px_rgba(26,43,75,0.05)] transition-shadow">
<span class="font-label-md text-label-md text-primary-fixed-dim bg-primary-container px-3 py-1.5 rounded uppercase tracking-wider">If</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Total Amount</option>
<option>Department</option>
<option>Vendor Rating</option>
</select>
<span class="font-body-sm text-body-sm text-on-surface-variant">is</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Greater Than</option>
<option>Less Than</option>
<option>Equal To</option>
</select>
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant font-body-sm">$</span>
<input class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-7 pr-3 shadow-sm w-32" type="text" value="5000"/>
</div>
<div class="flex-1"></div>
<button aria-label="Remove rule" class="text-danger hover:bg-danger-soft p-1.5 rounded-md transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Rule 2 -->
<div class="flex items-center gap-sm flex-wrap bg-surface-container-lowest border border-border p-md rounded-lg shadow-sm hover:shadow-[0_4px_12px_rgba(26,43,75,0.05)] transition-shadow">
<span class="font-label-md text-label-md text-secondary-fixed bg-secondary-container px-3 py-1.5 rounded uppercase tracking-wider">And</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Department</option>
<option>Total Amount</option>
<option>Cost Center</option>
</select>
<span class="font-body-sm text-body-sm text-on-surface-variant">is</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Equal To</option>
<option>Not Equal To</option>
<option>Contains</option>
</select>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Information Technology</option>
<option>Human Resources</option>
<option>Finance</option>
</select>
<div class="flex-1"></div>
<button aria-label="Remove rule" class="text-danger hover:bg-danger-soft p-1.5 rounded-md transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Add Rule Button -->
<div class="pt-sm">
<button class="flex items-center gap-xs font-label-md text-label-md text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                            Add Condition
                        </button>
</div>
</div>
<!-- Divider -->
<hr class="border-border"/>
<!-- Action Definition -->
<div class="flex flex-col gap-md">
<h3 class="font-headline-sm text-headline-sm text-primary">Outcome Action</h3>
<div class="flex items-center gap-sm flex-wrap bg-surface-container-low border border-border p-md rounded-lg shadow-sm">
<span class="font-label-md text-label-md text-success-soft bg-success px-3 py-1.5 rounded uppercase tracking-wider text-on-primary">Then</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-3 pr-8 shadow-sm">
<option>Route to</option>
<option>Reject automatically</option>
<option>Request more info from</option>
</select>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]">person</span>
<select class="bg-surface border-border text-on-surface font-body-sm text-body-sm rounded-md focus:border-secondary focus:ring-1 focus:ring-secondary focus:ring-opacity-10 py-1.5 pl-9 pr-8 shadow-sm">
<option>Finance Director</option>
<option>Department Head</option>
<option>Procurement Officer</option>
</select>
</div>
</div>
</div>
<!-- Natural Language Summary -->
<div class="bg-surface-bright border-l-4 border-info p-md rounded-r-lg mt-sm">
<div class="flex gap-sm">
<span class="material-symbols-outlined text-info mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-on-surface">
                            This rule will trigger for all <strong>IT</strong> requests exceeding <strong>$5,000</strong>, requiring an additional review step by the <strong>Finance Director</strong>.
                        </p>
</div>
</div>
</div>
<!-- Modal Footer -->
<footer class="flex items-center justify-end gap-md px-lg py-md border-t border-border bg-surface-bright">
<button class="font-label-md text-label-md text-secondary hover:text-primary px-4 py-2 rounded-md transition-colors">Cancel</button>
<button class="font-label-md text-label-md bg-primary text-on-primary px-6 py-2 rounded-md hover:bg-primary-container transition-colors shadow-sm">Save Condition</button>
</footer>
</div>
</main>
</body></html>
